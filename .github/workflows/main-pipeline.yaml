name: GlobalCart Main Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: globalcart-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci_test:
    name: CI and Test / Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint --if-present

      - name: Run unit tests
        run: npm test -- --ci

      - name: Build application
        run: npm run build

  publish_image:
    name: Build and Publish Docker Image
    needs: ci_test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    uses: ./.github/workflows/shared-docker.yaml
    with:
      image_name: ghcr.io/${{ github.repository }}
    secrets:
      registry_token: ${{ secrets.GITHUB_TOKEN }}

  deploy_production:
    name: Deploy to Production
    needs: publish_image
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment:
      name: Production
      url: https://example.com/globalcart

    steps:
      - name: Mock production deployment
        run: |
          echo "Deploying image ghcr.io/${{ github.repository }}:${{ needs.publish_image.outputs.image_tag }}"
          echo "Production deployment completed after manual approval"
