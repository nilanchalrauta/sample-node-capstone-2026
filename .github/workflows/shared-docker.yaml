name: Shared Docker Build and Publish

on:
  workflow_call:
    inputs:
      image_name:
        required: true
        type: string
    secrets:
      registry_token:
        required: true
    outputs:
      image_tag:
        description: Published image tag
        value: ${{ jobs.docker_build_push.outputs.image_tag }}

permissions:
  contents: read
  packages: write

jobs:
  docker_build_push:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Docker image tag
        id: meta
        run: |
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          IMAGE_TAG="run-${GITHUB_RUN_NUMBER}-${SHORT_SHA}"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.registry_token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ inputs.image_name }}:${{ steps.meta.outputs.image_tag }}
            ${{ inputs.image_name }}:latest
